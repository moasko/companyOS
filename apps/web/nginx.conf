# CompanyOS — service du front statique.
#
# Une SPA : toute route inconnue revient à index.html, et les assets
# empreints (hash dans le nom) se mettent en cache pour un an.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les fichiers du build portent leur empreinte : immuables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Le service worker doit toujours être revalidé, sinon une vieille
    # version de l'OS peut rester coincée en cache chez un utilisateur.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
