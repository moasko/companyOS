# CompanyOS — service du shell statique.
#
# Une SPA : toute route inconnue revient à index.html, et les assets
# empreints (hash dans le nom) se mettent en cache pour un an.
#
# La terminaison TLS est faite par le reverse-proxy devant (Traefik chez
# Dokploy) : ce serveur écoute en clair sur le réseau interne.

# ----------------------------------------------------------------------
# Vitrine sur le domaine nu
# ----------------------------------------------------------------------
#
# Le même conteneur sert deux noms : `app.companyos.fr`, où vit l'OS, et
# `companyos.fr` (ou `www.`), où un visiteur doit voir la page de
# présentation et non un écran de connexion.
#
# Sur le domaine nu, la racine nue affiche donc `landing.html` ; la racine
# avec paramètres (`/?connexion`, le lien « Se connecter » de la vitrine)
# renvoie vers l'application. Tout autre hôte — `app.`, un domaine
# d'essai, localhost — garde l'OS à la racine, comme avant.
map $host $vitrine {
    default                    0;
    ~*^(www\.)?companyos\.fr$  1;
}

map "$vitrine:$args" $accueil {
    default  "";
    "1:"     "vitrine";
    ~^1:.    "application";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version du serveur : elle n'aide que celui qui
    # cherche une faille connue.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # En-têtes de sécurité
    # ------------------------------------------------------------------
    #
    # `always` sur chacun : sans ce mot, nginx ne les pose pas sur les
    # réponses d'erreur — or une page 404 ou 500 est du HTML comme une
    # autre, et se prête au cadrage comme au reste.
    #
    # Note sur `add_header` : dès qu'un bloc `location` en déclare un, il
    # **remplace** tous ceux du bloc parent. C'est pourquoi les blocs
    # ci-dessous qui posent un `Cache-Control` répètent l'ensemble.

    # Politique de sécurité du contenu.
    #
    #   'wasm-unsafe-eval'  l'éditeur .docx embarque harfbuzz en WebAssembly ;
    #                       sans cette permission, l'app Word ne démarre pas.
    #   style-src 'unsafe-inline'
    #                       les bibliothèques d'édition posent des styles en
    #                       ligne. À retirer le jour où elles cesseront.
    #   __API_ORIGIN__      l'origine exacte de l'API, injectée au build par
    #                       apps/web/Dockerfile depuis VITE_API_URL — la même
    #                       valeur que celle figée dans le bundle du shell.
    #
    #                       Nommer l'origine plutôt que d'écrire `https:` en
    #                       gros : un déploiement sans TLS (domaine sslip.io
    #                       d'essai) sert l'API en http://, et un `https:`
    #                       seul bloquait alors *tous* les appels à l'API —
    #                       le shell s'affichait mais aucune connexion ne
    #                       passait, avec pour seul indice un « Failed to
    #                       fetch ». Nommer l'origine est aussi plus strict :
    #                       `https:` autorisait n'importe quel serveur.
    #
    #                       Elle apparaît dans connect-src (les appels API),
    #                       img-src (vignettes et avatars servis par
    #                       /api/files) et media-src (lecture en flux des
    #                       vidéos et de la musique).
    #   frame-src https:    le module Navigateur encadre des sites tiers.
    #   frame-ancestors 'none'
    #                       personne n'encadre CompanyOS — c'est ce qui
    #                       empêche le détournement de clic sur les actions
    #                       destructrices (suppression d'espace, changement
    #                       de rôle, vidage de corbeille).
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__; media-src 'self' blob: __API_ORIGIN__; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; worker-src 'self' blob:; frame-src https:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'";

    location /assets/ {
        # Les fichiers du build portent leur empreinte : immuables.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /sw.js {
        # Le service worker doit toujours être revalidé, sinon une vieille
        # version de l'OS reste coincée en cache chez un utilisateur.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = / {
        if ($accueil = "application") {
            return 302 https://app.companyos.fr$request_uri;
        }
        if ($accueil = "vitrine") {
            rewrite ^ /landing.html last;
        }
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # HSTS : un an, sous-domaines compris. À ne poser que si tout le
        # domaine est en HTTPS — c'est irréversible pendant la durée
        # annoncée, un navigateur qui l'a vu refusera le HTTP ensuite.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
