# CompanyOS en production — pensé pour Dokploy.
#
# Deux services : l'API et le shell. Dokploy lit ce fichier tel quel
# (service de type « Docker Compose »), fournit les variables depuis son
# onglet Environment, et attache les domaines via son interface :
#
#   - domaine du shell → service web, port 80
#   - domaine de l'API → service api, port 4000
#
# ─────────────────────────────────────────────────────────────────────────
# LES IMAGES SONT CONSTRUITES AILLEURS
#
# Ce fichier ne construit rien : il tire deux images déjà faites depuis
# ghcr.io, publiées par .github/workflows/images.yml à chaque poussée sur
# master.
#
# Construire le shell sur le serveur demandait plus de 3 Go de tas
# JavaScript — Monaco, les visionneuses Word et PowerPoint, pdf.js, le
# moteur 3D. Le VPS a 7,75 Go dont près de 4 déjà pris par les autres
# piles : le build s'y terminait par « Reached heap limit ». Les runners
# GitHub ont 16 Go et ne font rien d'autre.
#
# Conséquence pratique : un déploiement ne compile plus, il télécharge.
# Et changer de domaine impose de **reconstruire** l'image du shell, pas
# seulement de redéployer — l'URL de l'API est figée dans son bundle.
# ─────────────────────────────────────────────────────────────────────────
#
# ─────────────────────────────────────────────────────────────────────────
# LA BASE N'EST PAS ICI
#
# PostgreSQL est un service Dokploy à part, avec ses sauvegardes et son
# cycle de vie propres. C'est le bon découpage : une base ne doit pas être
# recréée parce qu'on redéploie une application, et Dokploy sait la
# sauvegarder tout seul — ce qu'il ne ferait pas d'un conteneur déclaré
# dans ce fichier.
#
# `DATABASE_URL` est donc fournie en entier depuis l'onglet Environment,
# et pointe sur l'hôte interne de la base :
#
#   postgresql://postgres:MOTDEPASSE@my-dbs-companyos-zqqgcq:5432/companyos_db?schema=public
#
# Ce nom d'hôte n'est résoluble que parce que les deux piles partagent le
# réseau `dokploy-network` — d'où sa déclaration en bas de fichier.
# ─────────────────────────────────────────────────────────────────────────
#
# Les deux images se construisent depuis la **racine du dépôt** : c'est là
# que vivent le package.json des workspaces et le lockfile.
#
# Le volume `storage-data` porte les fichiers des espaces de travail. Sans
# lui, chaque redéploiement viderait leur cloud.

services:
  api:
    image: ${IMAGE_API:-ghcr.io/moasko/companyos-api:latest}
    # `latest` ne change pas de nom quand son contenu change : sans cela,
    # Docker garderait indéfiniment la première version téléchargée et un
    # redéploiement ne déploierait rien.
    pull_policy: always
    restart: unless-stopped
    environment:
      # Fournie en entier depuis Dokploy — voir l'en-tête de ce fichier.
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Clé de chiffrement des secrets de configuration (S3, SMTP). Distincte
      # du secret JWT : une rotation de session ne doit pas rendre les
      # secrets stockés illisibles.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Le domaine public du shell, pour le CORS — https compris.
      CORS_ORIGIN: ${CORS_ORIGIN}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/storage
      DEFAULT_TENANT_QUOTA: ${DEFAULT_TENANT_QUOTA:-5368709120}
      UPLOAD_MAX_OCTETS: ${UPLOAD_MAX_OCTETS:-134217728}
      # Plafond d'envoi de courriels par espace et par 24 h — garde-fou
      # contre l'usage de la plateforme comme relais de spam.
      MAIL_QUOTA_JOUR: ${MAIL_QUOTA_JOUR:-500}
      # Relais SMTP sortant (invitations par mail). Facultatif : sans
      # SMTP_HOST, les invitations fonctionnent par code uniquement.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${CORS_ORIGIN}
      # Les liens de désinscription des campagnes pointent sur l'API.
      PUBLIC_API_URL: ${VITE_API_URL}
      # La console Plateforme : les emails des exploitants du SaaS.
      PLATFORM_ADMINS: ${PLATFORM_ADMINS:-}
      # Derrière le reverse-proxy de Dokploy : sans cela, la limitation de
      # débit compterait toutes les requêtes comme venant d'une seule IP,
      # et le journal d'audit enregistrerait la même adresse pour tout le
      # monde. Jamais `true` : ce serait croire l'en-tête envoyé par le
      # client lui-même.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - storage-data:/data/storage
    expose:
      - "4000"
    networks:
      - dokploy-network

  web:
    image: ${IMAGE_WEB:-ghcr.io/moasko/companyos-web:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks:
      - dokploy-network

volumes:
  storage-data:

# Le réseau que Dokploy crée à son installation. Le déclarer `external`
# plutôt que de le laisser créer un réseau propre à cette pile sert deux
# choses : Traefik peut router vers les conteneurs, et l'API peut résoudre
# le nom d'hôte de la base, qui vit dans un autre projet Dokploy.
networks:
  dokploy-network:
    external: true
